name: Build chopin kernel (Android 13)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch to build"
        required: true
        default: "4.14.186-A13"
      create_release:
        description: "Create a GitHub Release with the boot image"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  BOOT_ZIP_URL: "https://github.com/wudixxqq/xiaomi_kernel_chopin/releases/download/ci-assets/boot.zip"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          path: kernel

      - name: Download stock boot image
        run: |
          mkdir -p boot
          curl -L --fail --retry 3 -o boot/boot.zip "$BOOT_ZIP_URL"
          ls -lh boot/boot.zip

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-13 lld-13 llvm-13 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            build-essential flex bison libssl-dev libelf-dev \
            bc cpio rsync zip unzip ccache python3

      - name: Setup ReSukiSU CI 35236 (commit dac2d18)
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s dac2d186406a0d2b0ce3c67cad5a1fa1adbf9f4d
          grep -E "^config KSU_MANUAL_HOOK|^config KSU_SUSFS" drivers/kernelsu/Kconfig || true

      - name: Adapt kernel manual hooks for ReSukiSU
        working-directory: kernel
        run: |
          python3 - <<'EOF'
          import os, re, sys

          FORBIDDEN = ['ksu_vfs_read_hook', 'ksu_execveat_hook', 'ksu_handle_vfs_read']
          BLOCK_START = re.compile(r'#(ifdef\s+CONFIG_KSU\s*|if\s+defined\(CONFIG_KSU\)\s*)$')

          def ropen(p):
              return open(p, encoding='utf-8', errors='surrogateescape')

          def wopen(p):
              return open(p, 'w', encoding='utf-8', errors='surrogateescape')

          def iter_sources():
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs
                             if d not in ('out', '.git', 'KernelSU')]
                  for fn in files:
                      if fn.endswith(('.c', '.h')):
                          yield os.path.join(root, fn)

          # --- Phase 0: decouple the hook-method choice in kernelsu Kconfig ---
          # choice { TRACEPOINT / MANUAL / SUSFS } is mutually exclusive and
          # defconfig already picks KSU_SUSFS, which silently drops KSU_MANUAL_HOOK.
          # Convert the choice into three independent bools so MANUAL + SUSFS coexist.
          p = 'drivers/kernelsu/Kconfig'
          with ropen(p) as f:
              lines = f.readlines()
          out, i, n = [], 0, len(lines)
          decoupled = 0
          while i < n:
              if lines[i].strip() == 'choice' and i + 1 < n and 'KernelSU Hooking Method' in lines[i + 1]:
                  j = i
                  while j < n and lines[j].strip() != 'endchoice':
                      j += 1
                  assert j < n, 'endchoice not found'
                  k = i
                  while k < j and not lines[k].strip().startswith('config '):
                      k += 1
                  assert k < j, 'no config inside choice'
                  out.extend(lines[k:j])
                  decoupled += 1
                  i = j + 1
                  continue
              out.append(lines[i])
              i += 1
          assert decoupled == 1, 'hook-method choice not found'
          with wopen(p) as f:
              f.writelines(out)
          txt = ''.join(out)
          assert 'config KSU_MANUAL_HOOK' in txt and 'config KSU_SUSFS' in txt
          assert not re.search(r'(?m)^\s*choice\s*$', txt)
          print('kernelsu/Kconfig hook choice decoupled')

          # --- Phase 1: fs/exec.c gate -> single ksu_handle_execveat() call ---
          p = 'fs/exec.c'
          with ropen(p) as f:
              lines = f.readlines()
          lines = [l for l in lines if 'extern bool ksu_execveat_hook' not in l]
          out, i, replaced = [], 0, 0
          while i < len(lines):
              l = lines[i]
              if 'if (unlikely(ksu_execveat_hook))' in l:
                  indent = l[:len(l) - len(l.lstrip())]
                  j = i + 1
                  while j < len(lines) and 'ksu_handle_execveat_sucompat(&fd' not in lines[j]:
                      j += 1
                  out.append(indent + 'ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n')
                  replaced += 1
                  i = j + 1
                  continue
              out.append(l)
              i += 1
          assert replaced == 1, 'exec.c gate not found'
          with wopen(p) as f:
              f.writelines(out)
          print('fs/exec.c gate replaced:', replaced)

          # --- Phase 2: strip only the forbidden vfs_read hook (read_write.c) ---
          removed_total = 0
          for path in iter_sources():
              with open(path, 'rb') as f:
                  if b'\x00' in f.read(4096):
                      continue
              with ropen(path) as f:
                  lines = f.readlines()
              src_all = ''.join(lines)
              if 'ksu_vfs_read_hook' not in src_all:
                  continue
              out, i, removed = [], 0, 0
              while i < len(lines):
                  if BLOCK_START.match(lines[i].strip()):
                      j, depth = i, 1
                      while j + 1 < len(lines) and depth:
                          j += 1
                          s = lines[j].strip()
                          if s.startswith('#if'):
                              depth += 1
                          elif s == '#endif':
                              depth -= 1
                      text = ''.join(lines[i:j+1])
                      if any(m in text for m in FORBIDDEN):
                          removed += 1
                          i = j + 1
                          continue
                  out.append(lines[i])
                  i += 1
              with wopen(path) as f:
                  f.writelines(out)
              removed_total += removed
              print('stripped', path, removed)
          print('total stripped:', removed_total)

          # --- Phase 3: kernel/reboot.c supercall entry ---
          p = 'kernel/reboot.c'
          with ropen(p) as f:
              src = f.read()
          anchor = 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,'
          assert anchor in src, 'reboot anchor missing'
          ins = ('#ifdef CONFIG_KSU_MANUAL_HOOK\n'
                 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n'
                 '#endif\n')
          idx = src.index(anchor)
          src = src[:idx] + ins + src[idx:]
          idx2 = src.index('SYSCALL_DEFINE4(reboot')
          seg = src[idx2:]
          a2 = 'int ret = 0;'
          k = seg.index(a2) + len(a2)
          ls = src.rfind('\n', 0, idx2 + k) + 1
          call = '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n'
          src = src[:ls] + call + src[ls:]
          with wopen(p) as f:
              f.write(src)
          assert src.count('ksu_handle_sys_reboot') == 2
          print('kernel/reboot.c patched')

          # --- Phase 4: fs/stat.c add newfstat_ret + fstat64_ret hooks ---
          p = 'fs/stat.c'
          with ropen(p) as f:
              src = f.read()

          ext1 = ('#ifdef CONFIG_KSU_MANUAL_HOOK\n'
                  'extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n'
                  '#endif\n')
          a1 = 'SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)'
          assert a1 in src, 'newfstat anchor missing'
          src = src[:src.index(a1)] + ext1 + src[src.index(a1):]
          idx = src.index(a1)
          k = src.index('return error;', idx)
          ls = src.rfind('\n', 0, k) + 1
          src = src[:ls] + '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n' + src[ls:]

          ext2 = ('#ifdef CONFIG_KSU_MANUAL_HOOK\n'
                  'extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n'
                  '#endif\n')
          a2s = 'SYSCALL_DEFINE2(fstat64, unsigned long, fd'
          assert a2s in src, 'fstat64 anchor missing'
          src = src[:src.index(a2s)] + ext2 + src[src.index(a2s):]
          idx = src.index(a2s)
          k = src.index('return error;', idx)
          ls = src.rfind('\n', 0, k) + 1
          src = src[:ls] + '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n' + src[ls:]

          with wopen(p) as f:
              f.write(src)
          assert src.count('ksu_handle_newfstat_ret') == 2
          assert src.count('ksu_handle_fstat64_ret') == 2
          print('fs/stat.c ret hooks added')

          # --- Phase 4b: fs/notify/fdinfo.c susfs merge fix ---
          # susfs patch leaves `out_seq_printf:` label directly before a variable
          # declaration, which is illegal before C23 and breaks 4.14 builds.
          p = 'fs/notify/fdinfo.c'
          with ropen(p) as f:
              lines = f.readlines()
          out, fixed = [], 0
          for idx, l in enumerate(lines):
              out.append(l)
              if l.strip() == 'out_seq_printf:' and fixed == 0:
                  nxt = lines[idx + 1].strip() if idx + 1 < len(lines) else ''
                  if nxt != ';':
                      out.append('\t;\n')
                  fixed += 1
          assert fixed == 1, 'fdinfo out_seq_printf label not found'
          with wopen(p) as f:
              f.writelines(out)
          print('fs/notify/fdinfo.c label fix applied')

          # --- Phase 5: verify required hooks present, forbidden absent ---
          required = {
              'fs/exec.c': ['ksu_handle_execveat(&fd'],
              'fs/open.c': ['ksu_handle_faccessat(&dfd'],
              'fs/stat.c': ['ksu_handle_stat(&dfd', 'ksu_handle_newfstat_ret(&fd', 'ksu_handle_fstat64_ret(&fd'],
              'drivers/input/input.c': ['ksu_handle_input_handle_event(&type'],
              'kernel/reboot.c': ['ksu_handle_sys_reboot(magic1'],
              'fs/notify/fdinfo.c': ['out_seq_printf:'],
          }
          for path, needles in required.items():
              with ropen(path) as f:
                  src = f.read()
              for nd in needles:
                  assert nd in src, '%s missing %s' % (path, nd)
              print('OK', path)
          bad = []
          for path in iter_sources():
              with open(path, 'rb') as f:
                  if b'\x00' in f.read(4096):
                      continue
              with ropen(path) as f:
                  for ln, line in enumerate(f, 1):
                      if any(m in line for m in FORBIDDEN):
                          bad.append('%s:%d: %s' % (path, ln, line.strip()))
          if bad:
              print('FORBIDDEN SYMBOLS LEFT:')
              print('\n'.join(bad))
              sys.exit(1)
          print('VERIFICATION CLEAN')
          EOF
          echo "--- verify ---"
          grep -n "ksu_handle_execveat(&fd" fs/exec.c
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c
          grep -c "ksu_handle" fs/stat.c fs/open.c drivers/input/input.c fs/inode.c

      - name: Configure kernel
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 CC="ccache clang-13" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            chopin_defconfig

          scripts/config --file out/.config --set-str LOCALVERSION "-chopin-a13"
          scripts/config --file out/.config -d DEBUG_INFO
          scripts/config --file out/.config \
            -d COMMON_CLK_MT8168 \
            -d COMMON_CLK_MT8183 \
            -d PINCTRL_MT8183 \
            -d MTK_AEE_IPANIC
          # ReSukiSU CI 35236: manual hook + LSM auto setuid/initrc + SUSFS features
          # (hook-method choice was decoupled in the patch step, MANUAL + SUSFS coexist)
          scripts/config --file out/.config \
            -e KPROBES -e KPROBE_EVENTS \
            -e KSU -e KSU_MANUAL_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            -e KSU_SUSFS
          make O=out ARCH=arm64 olddefconfig
          grep -E "^CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_SUSFS|KPROBES|OVERLAY_FS|EXT4_FS)" out/.config || true
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config || { echo "FATAL: CONFIG_KSU_MANUAL_HOOK dropped by olddefconfig"; exit 1; }
          grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "FATAL: CONFIG_KSU_SUSFS dropped by olddefconfig"; exit 1; }

      - name: Build kernel Image
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 -j$(nproc) CC="ccache clang-13" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" Image

      - name: Prepare magiskboot
        run: |
          curl -L --fail --retry 3 -o magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
          unzip -o magisk.apk "lib/x86_64/libmagiskboot.so" -d mb
          cp mb/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -5 || true

      - name: Repack boot.img with new kernel
        run: |
          mkdir -p work
          cd work
          unzip -o ../boot/boot.zip
          ../magiskboot unpack boot.img
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ../magiskboot repack boot.img boot-chopin-a13.img
          sha256sum boot-chopin-a13.img > boot-chopin-a13.img.sha256
          ls -lh boot.img boot-chopin-a13.img kernel
          cat boot-chopin-a13.img.sha256

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-chopin-a13
          path: |
            work/boot-chopin-a13.img
            work/boot-chopin-a13.img.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            work/boot-chopin-a13.img \
            work/boot-chopin-a13.img.sha256 \
            --title "chopin Android 13 kernel + ReSukiSU ($tag)" \
            --notes "kernel: ${{ inputs.kernel_ref }} | ReSukiSU: CI 35236 / commit dac2d18 (manual hook, SUSFS) | boot base: MIUI V14.0.8.0.TKPCNXM | manager: ReSukiSU CI 35236"
