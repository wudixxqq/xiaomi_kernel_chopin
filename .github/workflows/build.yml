name: Build chopin kernel (Android 13)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch to build"
        required: true
        default: "4.14.186-A13"
      create_release:
        description: "Create a GitHub Release with the boot image"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  BOOT_ZIP_URL: "https://github.com/wudixxqq/xiaomi_kernel_chopin/releases/download/ci-assets/boot.zip"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          path: kernel

      - name: Download stock boot image
        run: |
          mkdir -p boot
          curl -L --fail --retry 3 -o boot/boot.zip "$BOOT_ZIP_URL"
          ls -lh boot/boot.zip

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-13 lld-13 llvm-13 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            build-essential flex bison libssl-dev libelf-dev \
            bc cpio rsync zip unzip ccache python3

      - name: Setup KernelSU-Next v3.4.0-legacy (manual hook build for 4.14)
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.4.0-legacy
          grep -E "config KSU|config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig || true

      - name: Adapt kernel manual hooks for KSU-Next v3.x
        working-directory: kernel
        run: |
          python3 - <<'EOF'
          import os, re, sys

          DISALLOW = ['ksu_vfs_read_hook', 'ksu_input_hook', 'ksu_execveat_hook',
                      'ksu_handle_vfs_read', 'ksu_handle_input_handle_event',
                      'ksu_handle_devpts', 'ksu_handle_faccessat', 'ksu_handle_stat']

          BLOCK_START = re.compile(r'#(ifdef\s+CONFIG_KSU\s*|if\s+defined\(CONFIG_KSU\)\s*)$')

          def ropen(p):
              return open(p, encoding='utf-8', errors='surrogateescape')

          def wopen(p):
              return open(p, 'w', encoding='utf-8', errors='surrogateescape')

          def iter_sources():
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs
                             if d not in ('out', '.git', 'KernelSU-Next')]
                  for fn in files:
                      if fn.endswith(('.c', '.h')):
                          yield os.path.join(root, fn)

          def strip_blocks(path):
              with ropen(path) as f:
                  lines = f.readlines()
              out, i, removed = [], 0, 0
              while i < len(lines):
                  if BLOCK_START.match(lines[i].strip()):
                      j, depth = i, 1
                      while j + 1 < len(lines) and depth:
                          j += 1
                          s = lines[j].strip()
                          if s.startswith('#if'):
                              depth += 1
                          elif s == '#endif':
                              depth -= 1
                      text = ''.join(lines[i:j+1])
                      if any(m in text for m in DISALLOW):
                          removed += 1
                          i = j + 1
                          continue
                  out.append(lines[i])
                  i += 1
              if removed:
                  with wopen(path) as f:
                      f.writelines(out)
              return removed

          # --- Phase 1: fs/exec.c gate replacement (before tree-wide strip) ---
          p = 'fs/exec.c'
          with ropen(p) as f:
              lines = f.readlines()
          lines = [l for l in lines if 'extern bool ksu_execveat_hook' not in l]
          out, i, replaced = [], 0, 0
          while i < len(lines):
              l = lines[i]
              if 'if (unlikely(ksu_execveat_hook))' in l:
                  indent = l[:len(l) - len(l.lstrip())]
                  j = i + 1
                  while j < len(lines) and 'ksu_handle_execveat_sucompat(&fd' not in lines[j]:
                      j += 1
                  out.append(indent + 'ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n')
                  replaced += 1
                  i = j + 1
                  continue
              out.append(l)
              i += 1
          assert replaced == 1, 'exec.c gate not found'
          with wopen(p) as f:
              f.writelines(out)
          print('fs/exec.c gate replaced:', replaced)

          # --- Phase 2: strip all unsupported #ifdef CONFIG_KSU hooks tree-wide ---
          total, touched = 0, []
          for path in iter_sources():
              with open(path, 'rb') as f:
                  if b'\x00' in f.read(4096):
                      continue
              with ropen(path) as f:
                  src = f.read()
              if 'CONFIG_KSU' not in src:
                  continue
              n = strip_blocks(path)
              if n:
                  total += n
                  touched.append('%s(%d)' % (path, n))
          print('stripped blocks:', total, touched)

          # --- Phase 3: kernel/reboot.c supercall entry (manager channel) ---
          p = 'kernel/reboot.c'
          with ropen(p) as f:
              src = f.read()
          anchor = 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,'
          assert anchor in src, 'reboot anchor missing'
          ins = ('#ifdef CONFIG_KSU\n'
                 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n'
                 '#endif\n')
          idx = src.index(anchor)
          src = src[:idx] + ins + src[idx:]
          idx2 = src.index('SYSCALL_DEFINE4(reboot')
          seg = src[idx2:]
          a2 = 'int ret = 0;'
          k = seg.index(a2) + len(a2)
          call = '\n#ifdef CONFIG_KSU\n        ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif'
          src = src[:idx2 + k] + call + src[idx2 + k:]
          with wopen(p) as f:
              f.write(src)
          assert src.count('ksu_handle_sys_reboot') == 2
          print('kernel/reboot.c patched')

          # --- Phase 4: full-tree verification, fail fast on leftovers ---
          allowed = ('./fs/exec.c', './kernel/reboot.c')
          bad = []
          for path in iter_sources():
              if path.replace('\\', '/') in allowed:
                  continue
              with open(path, 'rb') as f:
                  if b'\x00' in f.read(4096):
                      continue
              with ropen(path) as f:
                  for ln, line in enumerate(f, 1):
                      if ('ksu_handle' in line or 'ksu_execveat_hook' in line or
                              'ksu_vfs_read_hook' in line or 'ksu_input_hook' in line):
                          bad.append('%s:%d: %s' % (path, ln, line.strip()))
          if bad:
              print('LEFTOVER KSU HOOKS:')
              print('\n'.join(bad))
              sys.exit(1)
          print('VERIFICATION CLEAN')
          EOF
          echo "--- verify ---"
          grep -n "ksu_handle_execveat(&fd" fs/exec.c
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c
          grep -rn "ksu_handle" --include=*.c fs/ drivers/input/ kernel/reboot.c | grep -v "ksu_handle_execveat(&fd\|ksu_handle_sys_reboot\|extern int ksu_handle" || echo "clean"

      - name: Configure kernel
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 CC="ccache clang-13" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            chopin_defconfig

          scripts/config --file out/.config --set-str LOCALVERSION "-chopin-a13"
          scripts/config --file out/.config -d DEBUG_INFO
          scripts/config --file out/.config \
            -d COMMON_CLK_MT8168 \
            -d COMMON_CLK_MT8183 \
            -d PINCTRL_MT8183 \
            -d MTK_AEE_IPANIC
          # KSU-Next v3.4.0-legacy: manual hook mode (kprobe hook path needs >=5.10)
          scripts/config --file out/.config -e KPROBES -e KPROBE_EVENTS -e KSU -e KSU_MANUAL_HOOK
          make O=out ARCH=arm64 olddefconfig
          grep -E "^CONFIG_(KSU|KSU_MANUAL_HOOK|KPROBES|OVERLAY_FS|EXT4_FS)" out/.config || true

      - name: Build kernel Image
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 -j$(nproc) CC="ccache clang-13" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" Image

      - name: Prepare magiskboot
        run: |
          curl -L --fail --retry 3 -o magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
          unzip -o magisk.apk "lib/x86_64/libmagiskboot.so" -d mb
          cp mb/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -5 || true

      - name: Repack boot.img with new kernel
        run: |
          mkdir -p work
          cd work
          unzip -o ../boot/boot.zip
          ../magiskboot unpack boot.img
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ../magiskboot repack boot.img boot-chopin-a13.img
          sha256sum boot-chopin-a13.img > boot-chopin-a13.img.sha256
          ls -lh boot.img boot-chopin-a13.img kernel
          cat boot-chopin-a13.img.sha256

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-chopin-a13
          path: |
            work/boot-chopin-a13.img
            work/boot-chopin-a13.img.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            work/boot-chopin-a13.img \
            work/boot-chopin-a13.img.sha256 \
            --title "chopin Android 13 kernel + KernelSU-Next ($tag)" \
            --notes "kernel: ${{ inputs.kernel_ref }} | KSU-Next: v3.4.0-legacy (manual hook) | boot base: MIUI V14.0.8.0.TKPCNXM"
