name: Build chopin kernel (Android 13)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch to build"
        required: true
        default: "4.14.186-A13"
      create_release:
        description: "Create a GitHub Release with the boot image"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  BOOT_ZIP_URL: "https://github.com/wudixxqq/xiaomi_kernel_chopin/releases/download/ci-assets/boot.zip"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          path: kernel

      - name: Checkout CI compat assets
        uses: actions/checkout@v4
        with:
          ref: backport-4.14.336-A15-etc
          path: ci

      - name: Download stock boot image
        run: |
          mkdir -p boot
          curl -L --fail --retry 3 -o boot/boot.zip "$BOOT_ZIP_URL"
          ls -lh boot/boot.zip

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-13 lld-13 llvm-13 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            build-essential flex bison libssl-dev libelf-dev \
            bc cpio rsync zip unzip ccache python3

      - name: Setup BakaSU CI 35236 (commit dac2d18)
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s dac2d186406a0d2b0ce3c67cad5a1fa1adbf9f4d
          grep -E "^config KSU_MANUAL_HOOK|^config KSU_SUSFS" drivers/kernelsu/Kconfig || true

      - name: Apply susfs compat (v2 dispatch shim + susfs-style hooks)
        working-directory: kernel
        run: |
          python3 ../ci/susfs_compat/patch_hooks.py
          cp ../ci/susfs_compat/susfs.c        fs/susfs.c
          cp ../ci/susfs_compat/susfs.h        include/linux/susfs.h
          cp ../ci/susfs_compat/susfs_def.h    include/linux/susfs_def.h
          cp ../ci/susfs_compat/susfs_compat.c fs/susfs_compat.c
          echo "--- verify ---"
          grep -n "obj-.*susfs" fs/Makefile
          grep -n "susfs_compat_init" fs/susfs.c | head -2
          grep -c "void __user \*\*" include/linux/susfs.h

      - name: Configure kernel
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 CC="ccache clang-13" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            chopin_defconfig

          # stock MIUI kernel version string: 4.14.186-g0dc1d312efb3
          scripts/config --file out/.config --set-str LOCALVERSION "-g0dc1d312efb3"
          scripts/config --file out/.config -d DEBUG_INFO
          scripts/config --file out/.config \
            -d COMMON_CLK_MT8168 \
            -d COMMON_CLK_MT8183 \
            -d PINCTRL_MT8183 \
            -d MTK_AEE_IPANIC

          # SUSFS route: KSU_SUSFS hook mode (mutually exclusive with MANUAL_HOOK).
          # TRY_UMOUNT off: legacy ksu_try_umount() symbol does not exist in
          # BakaSU; module umounts via its own kernel_umount path.
          # SUS_MAP off / SUS_SU off: no v1.5.5 backend, shim answers -EOPNOTSUPP.
          scripts/config --file out/.config \
            -e KPROBES -e KPROBE_EVENTS \
            -e KSU -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -d KSU_SUSFS_TRY_UMOUNT \
            -d KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -d KSU_SUSFS_SUS_MAP \
            -d KSU_SUSFS_SUS_SU \
            -d KSU_SUSFS_SUS_OVERLAYFS \
            -d KSU_MANUAL_HOOK
          make O=out ARCH=arm64 olddefconfig

          echo "--- final SUSFS config ---"
          grep -E "^CONFIG_KSU" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || { echo "FATAL: CONFIG_KSU dropped"; exit 1; }
          grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "FATAL: CONFIG_KSU_SUSFS dropped by olddefconfig"; exit 1; }
          grep -Eq "^# CONFIG_KSU_MANUAL_HOOK is not set|^CONFIG_KSU_MANUAL_HOOK=n" out/.config || { echo "FATAL: CONFIG_KSU_MANUAL_HOOK still enabled"; exit 1; }
          for opt in SUS_PATH SUS_MOUNT SUS_KSTAT SPOOF_UNAME ENABLE_LOG HIDE_KSU_SUSFS_SYMBOLS SPOOF_CMDLINE_OR_BOOTCONFIG OPEN_REDIRECT; do
            grep -q "^CONFIG_KSU_SUSFS_${opt}=y" out/.config || { echo "FATAL: CONFIG_KSU_SUSFS_${opt} dropped"; exit 1; }
          done
          grep -q "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" out/.config && { echo "FATAL: TRY_UMOUNT must be off"; exit 1; } || true

      - name: Build kernel Image
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 -j$(nproc) CC="ccache clang-13" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" Image

      - name: Prepare magiskboot
        run: |
          curl -L --fail --retry 3 -o magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
          unzip -o magisk.apk "lib/x86_64/libmagiskboot.so" -d mb
          cp mb/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -5 || true

      - name: Repack boot.img with new kernel
        run: |
          mkdir -p work
          cd work
          unzip -o ../boot/boot.zip
          ../magiskboot unpack boot.img
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ../magiskboot repack boot.img boot-chopin-a13.img
          sha256sum boot-chopin-a13.img > boot-chopin-a13.img.sha256
          ls -lh boot.img boot-chopin-a13.img kernel
          cat boot-chopin-a13.img.sha256

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-chopin-a13
          path: |
            work/boot-chopin-a13.img
            work/boot-chopin-a13.img.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            work/boot-chopin-a13.img \
            work/boot-chopin-a13.img.sha256 \
            --title "chopin Android 13 kernel + BakaSU + SUSFS ($tag)" \
            --notes "kernel: ${{ inputs.kernel_ref }} (4.14.186-g0dc1d312efb3) | BakaSU: CI 35236 / commit dac2d18 (SUSFS hook mode) | susfs kernel-side: v1.5.5 + v2 dispatch compat shim | boot base: MIUI V14.0.8.0.TKPCNXM | manager: BakaSU CI 35236"
